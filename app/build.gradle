plugins { id 'com.android.application' }
android {
    namespace 'de.cagalj.fahrtenapp'
    compileSdk 35
    defaultConfig {
        applicationId 'de.cagalj.fahrtenapp'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '3.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation "androidx.core:core:1.13.1"; implementation "com.google.mlkit:text-recognition:16.0.1" }

// Alle Kotlin-Laufzeitbibliotheken auf dieselbe Version setzen.
configurations.configureEach {
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22',
            'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22',
            'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
}
